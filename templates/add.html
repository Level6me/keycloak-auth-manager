<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>添加认证 - Auth 认证管理</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/css/abit.css">
</head>
<body>

<div class="container" style="max-width: 760px;">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="header-title-group">
                <span class="date-badge">NEW REVERSE PROXY AUTH</span>
                <h1 class="title">添加域名认证</h1>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" title="切换亮暗主题" style="width: 36px; height: 36px; font-size: 17px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                🌓
            </button>
        </div>
    </header>

    <div class="card">
        <form id="authForm">
            <!-- 1. 域名输入 -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" style="margin-bottom: 0;">🌐 网站访问域名</label>
                    <span id="add_cf_badge" class="badge accent" style="font-size: 11px; display: none;">☁️ Cloudflare 联动已开启</span>
                </div>

                <!-- 1. 组合模式：前缀 + CF下拉 -->
                <div id="add_domain_combo_wrap" style="display: flex; align-items: center; gap: 8px;">
                    <div style="flex: 1; position: relative;">
                        <input type="text" id="add_subdomain" class="input-box" placeholder="二级前缀 (如 app 或 @)" 
                               autocomplete="off" autocorrect="off" autocapitalize="off" oninput="updateCombinedDomain()">
                    </div>
                    <span style="font-weight: 800; font-size: 18px; color: var(--text-sec); user-select: none;">.</span>
                    <div style="flex: 1.4;">
                        <select id="add_root_domain" class="select-custom" onchange="handleRootDomainChange(this.value)">
                            <option value="">正在加载 Cloudflare 域名...</option>
                            <option value="__custom__">✏️ 手动输入完整域名...</option>
                        </select>
                    </div>
                </div>

                <!-- 2. 手动输入完整域名模式 -->
                <div id="add_domain_custom_wrap" style="display: none; margin-top: 6px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="add_custom_domain" class="input-box" placeholder="例如: app.example.com" 
                               autocomplete="off" autocorrect="off" autocapitalize="off" oninput="updateCombinedDomain()">
                        <button type="button" class="btn secondary sm" onclick="backToComboDomain()" style="padding: 10px 14px; white-space: nowrap; font-size: 12px;">
                            ↩️ 返回下拉选择
                        </button>
                    </div>
                </div>

                <!-- 隐藏表单字段 -->
                <input type="hidden" name="domain" id="add_domain_hidden" required>
                <input type="hidden" name="cf_add_dns" id="add_cf_dns_hidden" value="false">
                <input type="hidden" name="cf_proxied" id="add_cf_proxied_hidden" value="false">
                <input type="hidden" name="cf_server_ip" id="add_cf_server_ip_hidden" value="">

                <!-- 域名实时预览与 Cloudflare 解析提示卡片 -->
                <div id="add_domain_preview_tip" style="margin-top: 8px; font-size: 12px; color: var(--text-sec); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
                    <div>
                        <span>完整域名: </span>
                        <code id="add_preview_domain_val" style="font-weight: 700; color: var(--accent); background: var(--card-sec); padding: 2px 6px; border-radius: 4px;">未填写</code>
                    </div>
                    <label id="add_cf_proxied_container" style="display: none; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text);">
                        <input type="checkbox" id="add_cf_proxied_checkbox" onchange="document.getElementById('add_cf_proxied_hidden').value = this.checked ? 'true' : 'false'">
                        <span>☁️ 开启 CF 小黄云 CDN 代理</span>
                    </label>
                </div>
                <div class="form-hint" id="add_domain_hint">请填写或选择域名。若选择 Cloudflare 域名，创建时将自动添加 DNS A 记录。</div>
            </div>

            <!-- 2. 反代目标服务配置 -->
            <div class="form-group">
                <label class="form-label">🎯 反代目标服务地址</label>
                <div class="segmented-control" style="margin-bottom: 10px;">
                    <button type="button" class="segment-btn active" id="type_local_btn" onclick="selectTargetType('local')">
                        🖥️ 本地服务 (127.0.0.1)
                    </button>
                    <button type="button" class="segment-btn" id="type_custom_btn" onclick="selectTargetType('custom')">
                        🌍 自定义 IP / 域名
                    </button>
                </div>
                <input type="hidden" name="target_type" id="target_type" value="local">

                <!-- 自定义主机输入 -->
                <div id="custom_host_container" style="display: none; margin-bottom: 10px;">
                    <input type="text" name="target_host" id="target_host" class="input-box" 
                           placeholder="例如: 192.168.1.100 或 internal-service.lan">
                    <div class="form-hint">反代目标服务器的主机名或 IP 地址</div>
                </div>

                <!-- 目标端口 -->
                <div>
                    <input type="number" name="port" id="port" class="input-box" 
                           placeholder="例如: 8080 或 3000" required min="1" max="65535">
                    <div class="form-hint">目标后端服务监听的端口号</div>
                </div>
            </div>

            <!-- 3. 联动申请 SSL 证书 -->
            <div class="card" style="background: var(--card-sec); border-color: var(--border-subtle); padding: 16px; margin: 20px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-size: 14px; font-weight: 700; color: var(--text);">🔒 联动申请 SSL 证书 (HTTPS)</span>
                        <span style="font-size: 12px; color: var(--text-sec); margin-top: 2px;">添加完成后自动调用 1Panel ACME 签发免费证书并强制启用 HTTPS</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="apply_ssl" name="apply_ssl" onchange="toggleSSLSection(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- SSL 展开配置 -->
                <div id="ssl_config_container" style="display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-subtle);">
                    <div class="form-group">
                        <label class="form-label" style="font-size: 12px;">ACME 账户</label>
                        <select class="select-custom" id="acme_account" name="acme_id">
                            <option value="">正在加载 1Panel ACME 账户...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" style="font-size: 12px;">验证方式</label>
                        <select class="select-custom" id="auth_method" onchange="toggleDNSSection(this.value)">
                            <option value="http">HTTP 验证（默认，需域名 80 端口可公开访问）</option>
                            <option value="dns">DNS 验证（需在 1Panel 提前配置 DNS 凭据，支持内网）</option>
                        </select>
                    </div>

                    <div class="form-group" id="dns_container" style="display: none;">
                        <label class="form-label" style="font-size: 12px;">DNS 账户</label>
                        <select class="select-custom" id="dns_account" name="dns_id">
                            <option value="">请选择 DNS 账户...</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn w-full" style="padding: 12px; font-size: 14px;">
                🚀 创建认证服务
            </button>
        </form>
    </div>

    <!-- Apple Terminal Log Window -->
    <div class="terminal-card">
        <div class="terminal-header">
            <div class="terminal-dots">
                <div class="terminal-dot red"></div>
                <div class="terminal-dot yellow"></div>
                <div class="terminal-dot green"></div>
            </div>
            <div class="terminal-title">DEPLOYMENT CONSOLE</div>
            <div id="statusBadge" class="badge secondary" style="font-size: 10px;">IDLE</div>
        </div>
        <div id="logs" class="terminal-body">
            <div class="system">[系统] 等待提交创建任务，实时安装日志将在此输出...</div>
        </div>
    </div>
</div>

<!-- Floating Glass Dock -->
<nav class="dock">
    <a href="/" class="dock-btn">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>域名</span>
    </a>
    <a href="/add" class="dock-btn active">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>添加</span>
    </a>
    <a href="/ssl" class="dock-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>证书</span>
    </a>
    <a href="/users" class="dock-btn">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>用户</span>
    </a>
    <a href="/settings" class="dock-btn">

        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>设置</span>
    </a>
</nav>

<script src="/static/js/abit.js"></script>
<script>
let eventSource = null;
let pollTimer = null;
let lastLogId = 0;
let acmeAccountsLoaded = false;
let cfZonesData = null;

async function loadCloudflareZones() {
    const select = document.getElementById('add_root_domain');
    const badge = document.getElementById('add_cf_badge');
    const proxiedContainer = document.getElementById('add_cf_proxied_container');
    const proxiedCheckbox = document.getElementById('add_cf_proxied_checkbox');
    const serverIpHidden = document.getElementById('add_cf_server_ip_hidden');
    const dnsHidden = document.getElementById('add_cf_dns_hidden');

    try {
        const res = await fetch('/api/cloudflare/zones');
        const data = await res.json();
        cfZonesData = data;

        if (data.server_ip) {
            serverIpHidden.value = data.server_ip;
        }

        select.innerHTML = '';

        if (data.configured && data.zones && data.zones.length > 0) {
            if (badge) badge.style.display = 'inline-flex';
            if (proxiedContainer) proxiedContainer.style.display = 'inline-flex';
            if (proxiedCheckbox) {
                proxiedCheckbox.checked = !!data.default_proxied;
                document.getElementById('add_cf_proxied_hidden').value = data.default_proxied ? 'true' : 'false';
            }

            data.zones.forEach((z, idx) => {
                const opt = document.createElement('option');
                opt.value = z.name;
                opt.textContent = `☁️ ${z.name}`;
                if (idx === 0) opt.selected = true;
                select.appendChild(opt);
            });

            const customOpt = document.createElement('option');
            customOpt.value = '__custom__';
            customOpt.textContent = '✏️ 手动输入完整域名...';
            select.appendChild(customOpt);

            dnsHidden.value = 'true';
        } else {
            if (badge) badge.style.display = 'none';
            if (proxiedContainer) proxiedContainer.style.display = 'none';
            dnsHidden.value = 'false';

            const noCfOpt = document.createElement('option');
            noCfOpt.value = '__custom__';
            noCfOpt.textContent = data.configured ? '未找到托管域名 (点此手动输入)' : '未配置 Cloudflare (点此手动输入)';
            select.appendChild(noCfOpt);

            handleRootDomainChange('__custom__');
        }
        updateCombinedDomain();
    } catch (e) {
        console.error('加载 Cloudflare 域名失败:', e);
        handleRootDomainChange('__custom__');
    }
}

function handleRootDomainChange(val) {
    const comboWrap = document.getElementById('add_domain_combo_wrap');
    const customWrap = document.getElementById('add_domain_custom_wrap');
    const proxiedContainer = document.getElementById('add_cf_proxied_container');
    const dnsHidden = document.getElementById('add_cf_dns_hidden');
    const hint = document.getElementById('add_domain_hint');

    if (val === '__custom__') {
        if (comboWrap) comboWrap.style.display = 'none';
        if (customWrap) customWrap.style.display = 'block';
        if (proxiedContainer) proxiedContainer.style.display = 'none';
        dnsHidden.value = 'false';
        if (hint) hint.textContent = '请填写已解析到本服务器的完整域名（如无需自动通过 Cloudflare 解析）。';
        const customInput = document.getElementById('add_custom_domain');
        if (customInput) customInput.focus();
    } else {
        if (comboWrap) comboWrap.style.display = 'flex';
        if (customWrap) customWrap.style.display = 'none';
        if (proxiedContainer && cfZonesData && cfZonesData.configured) proxiedContainer.style.display = 'inline-flex';
        dnsHidden.value = 'true';
        if (hint) hint.textContent = '已选择 Cloudflare 域名，创建服务时将自动添加 DNS A 记录并绑定到本机公网 IP。';
    }
    updateCombinedDomain();
}

function backToComboDomain() {
    const select = document.getElementById('add_root_domain');
    if (select && select.options.length > 0) {
        select.selectedIndex = 0;
        handleRootDomainChange(select.value);
    }
}

function updateCombinedDomain() {
    const customWrap = document.getElementById('add_domain_custom_wrap');
    const isCustom = customWrap && customWrap.style.display !== 'none';
    const hiddenDomain = document.getElementById('add_domain_hidden');
    const previewVal = document.getElementById('add_preview_domain_val');

    let fullDomain = '';
    if (isCustom) {
        fullDomain = (document.getElementById('add_custom_domain').value || '').trim().toLowerCase();
    } else {
        const sub = (document.getElementById('add_subdomain').value || '').trim().toLowerCase();
        const root = (document.getElementById('add_root_domain').value || '').trim().toLowerCase();
        if (root && root !== '__custom__') {
            if (!sub || sub === '@') {
                fullDomain = root;
            } else {
                fullDomain = `${sub}.${root}`;
            }
        }
    }

    fullDomain = fullDomain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    hiddenDomain.value = fullDomain;

    if (previewVal) {
        previewVal.textContent = fullDomain || '未填写完整';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadCloudflareZones();
});

function selectTargetType(type) {
    document.getElementById('target_type').value = type;
    const btnLocal = document.getElementById('type_local_btn');
    const btnCustom = document.getElementById('type_custom_btn');
    const customContainer = document.getElementById('custom_host_container');
    const hostInput = document.getElementById('target_host');

    if (type === 'custom') {
        btnCustom.classList.add('active');
        btnLocal.classList.remove('active');
        customContainer.style.display = 'block';
        hostInput.required = true;
        hostInput.focus();
    } else {
        btnLocal.classList.add('active');
        btnCustom.classList.remove('active');
        customContainer.style.display = 'none';
        hostInput.required = false;
    }
}

function toggleSSLSection(checked) {
    const container = document.getElementById('ssl_config_container');
    container.style.display = checked ? 'block' : 'none';
    if (checked && !acmeAccountsLoaded) {
        load1PanelAccounts();
    }
}

function toggleDNSSection(val) {
    const dnsBox = document.getElementById('dns_container');
    dnsBox.style.display = (val === 'dns') ? 'block' : 'none';
}

async function load1PanelAccounts() {
    try {
        const acmeRes = await fetch('/api/acme_accounts');
        const acmes = await acmeRes.json();
        const acmeSelect = document.getElementById('acme_account');
        acmeSelect.innerHTML = '';
        if (acmes.length === 0) {
            acmeSelect.innerHTML = '<option value="">未找到 1Panel ACME 账户，请先在 1Panel 中添加</option>';
        } else {
            acmes.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.id;
                opt.textContent = `${acc.email} (ID: ${acc.id})`;
                acmeSelect.appendChild(opt);
            });
            acmeAccountsLoaded = true;
        }

        const dnsRes = await fetch('/api/dns_accounts');
        const dnss = await dnsRes.json();
        const dnsSelect = document.getElementById('dns_account');
        dnsSelect.innerHTML = '';
        if (dnss.length === 0) {
            dnsSelect.innerHTML = '<option value="">未配置 DNS 账户</option>';
        } else {
            dnss.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.id;
                opt.textContent = `${acc.name} (ID: ${acc.id})`;
                dnsSelect.appendChild(opt);
            });
        }
    } catch (err) {
        console.error('加载 1Panel 账户失败:', err);
    }
}

function appendLogLine(text) {
    const logs = document.getElementById('logs');
    const line = document.createElement('div');
    line.textContent = text;
    if (text.includes('失败') || text.includes('error') || text.includes('Error') || text.includes('异常') || text.includes('Failed')) {
        line.className = 'error';
    } else if (text.includes('成功') || text.includes('完成') || text.includes('绑定成功') || text.includes('🎉')) {
        line.className = 'success';
    } else if (text.startsWith('[系统]')) {
        line.className = 'system';
    } else {
        line.className = 'info';
    }
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
}

function startLogStream() {
    lastLogId = 0;
    if (eventSource) eventSource.close();
    if (pollTimer) clearInterval(pollTimer);

    try {
        eventSource = new EventSource('/api/logs?last_id=0');
        eventSource.onmessage = function(event) {
            if (event.data && event.data !== 'heartbeat') {
                appendLogLine(event.data);
            }
            if (event.lastEventId) {
                lastLogId = parseInt(event.lastEventId) || lastLogId;
            }
        };
    } catch (err) {}

    // 双重保障轮询
    pollTimer = setInterval(async () => {
        try {
            const res = await fetch(`/api/logs/poll?last_id=${lastLogId}`);
            if (res.ok) {
                const data = await res.json();
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(entry => appendLogLine(entry.text));
                    lastLogId = data.last_id;
                }
            }
        } catch (e) {}
    }, 800);
}

function stopLogStream() {
    if (eventSource) setTimeout(() => eventSource.close(), 3000);
    if (pollTimer) setTimeout(() => clearInterval(pollTimer), 3500);
}

document.getElementById('authForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    updateCombinedDomain();

    const domainVal = document.getElementById('add_domain_hidden').value.trim();
    if (!domainVal) {
        showToast('请先输入有效的域名！', 'warning');
        return;
    }

    const btn = document.getElementById('submitBtn');
    const logs = document.getElementById('logs');
    const status = document.getElementById('statusBadge');
    
    btn.disabled = true;
    btn.innerHTML = '⏳ 正在处理中...';
    status.className = 'badge warning';
    status.textContent = 'RUNNING';
    logs.innerHTML = '<div class="system">[系统] 正在初始化部署环境并建立日志流...</div>';
    
    startLogStream();

    const formData = new FormData(this);
    try {
        const response = await fetch('/api/create', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        
        if (result.success) {
            status.className = 'badge success';
            status.textContent = 'SUCCESS';
            btn.innerHTML = '🎉 创建成功！';
            showToast('认证服务创建成功，正在跳转...', 'success');
            setTimeout(() => {
                window.location.href = '/detail/' + domainVal;
            }, 2500);
        } else {
            status.className = 'badge danger';
            status.textContent = 'FAILED';
            btn.innerHTML = '🚀 重新创建';
            btn.disabled = false;
            appendLogLine('[系统] 创建失败: ' + (result.error || '未知错误'));
            showToast('创建失败: ' + (result.error || '未知错误'), 'error');
        }
    } catch (err) {
        status.className = 'badge danger';
        status.textContent = 'NETWORK ERROR';
        btn.innerHTML = '🚀 重新创建';
        btn.disabled = false;
        appendLogLine('[系统] 网络请求失败: ' + err);
        showToast('网络请求发生异常', 'error');
    } finally {
        stopLogStream();
    }
});
</script>
</body>
</html>
