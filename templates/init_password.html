<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化管理员密码 - Keycloak Auth Manager</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
        }
        .btn-primary {
            background: #0071e3;
            border: none;
            border-radius: 12px;
            height: 48px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #0077ed;
            transform: translateY(-1px);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            height: 48px;
            padding: 0 16px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #0071e3;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-4">
        <div style="font-size: 40px; margin-bottom: 12px;">🛡️</div>
        <h3 class="fw-bold mb-2">首次使用初始化</h3>
        <p class="text-secondary small">为保障控制台安全，请首先设置管理员密码</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/init_password">
        <div class="mb-3">
            <label class="form-label text-secondary small">管理员账号</label>
            <input type="text" class="form-control" value="admin" disabled readonly>
        </div>
        <div class="mb-3">
            <label class="form-label text-secondary small">设置新密码（至少 6 位）</label>
            <input type="password" name="password" class="form-control" required placeholder="请输入安全密码" autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary small">确认新密码</label>
            <input type="password" name="password_confirm" class="form-control" required placeholder="请再次输入密码">
        </div>
        <button type="submit" class="btn btn-primary w-100">🔒 保存密码并进入控制台</button>
    </form>
</div>
</body>
</html>
